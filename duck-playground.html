<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Утка — стенд модели и анимаций</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; overflow: hidden; color: #eef7f8; background: radial-gradient(ellipse at 48% 42%, #173243 0, #0c1924 42%, #060b12 100%); }
    #stage { position: fixed; inset: 0; }
    #stage canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    #stage canvas:active { cursor: grabbing; }
    .topline { position: fixed; z-index: 2; top: 18px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; text-shadow: 0 2px 12px #000; }
    .topline strong { display: block; letter-spacing: .18em; font-size: 13px; color: #a6d9d7; }
    .topline span { display: block; margin-top: 5px; color: #93aab4; font-size: 11px; }
    .panel { position: fixed; z-index: 3; top: 16px; width: min(310px, calc(100vw - 24px)); max-height: calc(100vh - 32px); overflow: auto; padding: 13px; border: 1px solid #476274; border-radius: 14px; background: rgb(8 21 32 / 91%); box-shadow: 0 14px 42px #0008, inset 0 1px #ffffff12; backdrop-filter: blur(14px); scrollbar-color: #456174 #0a1721; }
    #animations { left: 16px; width: min(250px, calc(100vw - 24px)); }
    #model { right: 16px; width: min(330px, calc(100vw - 24px)); }
    .panel h1 { margin: 0 0 3px; color: #a7e6e0; font-size: 12px; letter-spacing: .13em; }
    .subhead { margin: 0 0 12px; color: #869eaa; font-size: 10px; line-height: 1.5; }
    .anim-row { display: flex; align-items: center; gap: 9px; min-height: 35px; padding: 5px 4px; border-top: 1px solid #ffffff12; color: #dce8ed; font-size: 12px; cursor: pointer; }
    .anim-row input { width: 15px; height: 15px; margin: 0; accent-color: #64d5c9; }
    details { border-top: 1px solid #ffffff19; }
    summary { padding: 10px 2px 7px; color: #b9e5e4; font-size: 11px; font-weight: 700; cursor: pointer; list-style-position: inside; }
    .control { display: block; margin: 7px 1px 10px; }
    .control-title { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 3px; color: #d5e2e7; font-size: 10px; }
    .control output { color: #8ee0d5; font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; height: 14px; margin: 0; accent-color: #63d6ca; }
    .actions { position: sticky; bottom: -13px; display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin: 11px -13px -13px; padding: 10px 13px 13px; border-top: 1px solid #476274; background: #091622f5; }
    button { min-height: 32px; padding: 6px 8px; border: 1px solid #476b7c; border-radius: 8px; color: #e9f8f8; background: #173448; font: inherit; font-size: 10px; font-weight: 700; cursor: pointer; }
    button:hover { background: #205063; }
    button:disabled { opacity: .45; cursor: default; }
    #copy-status { grid-column: 1 / -1; min-height: 12px; color: #8ee0d5; text-align: center; font-size: 10px; }
    .hint { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); color: #8da6b0; font-size: 10px; text-align: center; pointer-events: none; }
    @media (max-width: 720px) {
      body { overflow: auto; }
      #stage { position: fixed; inset: 0; }
      .topline { top: 8px; }
      .panel { top: auto; bottom: 10px; max-height: min(43vh, 360px); padding: 10px; }
      #animations { left: 8px; width: min(190px, calc(45vw - 10px)); }
      #model { right: 8px; width: min(255px, calc(55vw - 10px)); }
      .hint { bottom: calc(min(43vh, 360px) + 16px); width: 100%; }
    }
  </style>
  <script type="importmap">

        const title=document.createElement('span');title.className='control-title';
        const name=document.createElement('span');name.textContent=labels[key]||key;
        const output=document.createElement('output');output.value=params[key].toFixed(2);output.textContent=rotation?`${(params[key]*180/Math.PI).toFixed(0)}°`:params[key].toFixed(2);
        title.append(name,output);
        const input=document.createElement('input');input.type='range';input.min=min;input.max=max;input.step='.01';input.value=params[key];
        input.addEventListener('pointerdown',()=>{dragSnapshot={...params};});
        input.addEventListener('keydown',()=>{dragSnapshot={...params};});
        input.addEventListener('input',()=>{if(!undoSnapshot&&dragSnapshot)undoSnapshot=dragSnapshot;params[key]=Number(input.value);output.textContent=rotation?`${(params[key]*180/Math.PI).toFixed(0)}°`:params[key].toFixed(2);applyParams();document.querySelector('#undo').disabled=false;});
        input.addEventListener('change',()=>{if(dragSnapshot)undoSnapshot=dragSnapshot;dragSnapshot=null;document.querySelector('#undo').disabled=!undoSnapshot;});
        label.append(title,input);section.append(label);controlMap.set(key,{input,output,rotation});
      }
      controls.append(section);
    }
    document.querySelector('#undo').addEventListener('click',()=>{if(!undoSnapshot)return;Object.assign(params,undoSnapshot);for(const [key,c] of controlMap){c.input.value=params[key];c.output.textContent=c.rotation?`${(params[key]*180/Math.PI).toFixed(0)}°`:params[key].toFixed(2);}undoSnapshot=null;document.querySelector('#undo').disabled=true;applyParams();});
    document.querySelector('#copy').addEventListener('click',async()=>{const text=JSON.stringify(params,null,2);try{await navigator.clipboard.writeText(text);}catch{const area=document.createElement('textarea');area.value=text;document.body.append(area);area.select();document.execCommand('copy');area.remove();}const status=document.querySelector('#copy-status');status.textContent='JSON скопирован';setTimeout(()=>status.textContent='',1700);});

    const animations={cursorEyes:true,blink:true,dance:false};
    document.querySelectorAll('[data-animation]').forEach(input=>input.addEventListener('change',()=>animations[input.dataset.animation]=input.checked));
    const raycaster=new THREE.Raycaster(),mouseNdc=new THREE.Vector2(),lookPlane=new THREE.Plane(new THREE.Vector3(0,0,1),0),lookPoint=new THREE.Vector3();
    let pointer={x:innerWidth/2,y:innerHeight/2},drag=null,lastTime=performance.now(),time=0,danceBlend=0;
    renderer.domElement.addEventListener('pointermove',e=>{pointer={x:e.clientX,y:e.clientY};if(drag){orbitYaw-=e.movementX*.006;orbitPitch=THREE.MathUtils.clamp(orbitPitch+e.movementY*.005,-.45,1.05);}});
    renderer.domElement.addEventListener('pointerdown',e=>{drag={id:e.pointerId};renderer.domElement.setPointerCapture(e.pointerId);});
    renderer.domElement.addEventListener('pointerup',()=>drag=null);
    renderer.domElement.addEventListener('pointercancel',()=>drag=null);
    renderer.domElement.addEventListener('wheel',e=>{cameraRadius=THREE.MathUtils.clamp(cameraRadius+e.deltaY*.004,3.5,10);},{passive:true});
    function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));}
    addEventListener('resize',resize);

    function animate(now){
      requestAnimationFrame(animate);const dt=Math.min(.05,(now-lastTime)/1000);lastTime=now;time+=dt;
      camera.position.set(cameraTarget.x+Math.sin(orbitYaw)*Math.cos(orbitPitch)*cameraRadius,cameraTarget.y+Math.sin(orbitPitch)*cameraRadius,cameraTarget.z+Math.cos(orbitYaw)*Math.cos(orbitPitch)*cameraRadius);camera.lookAt(cameraTarget);
      camera.updateMatrixWorld();
      const rect=renderer.domElement.getBoundingClientRect();mouseNdc.set((pointer.x-rect.left)/rect.width*2-1,-((pointer.y-rect.top)/rect.height)*2+1);raycaster.setFromCamera(mouseNdc,camera);raycaster.ray.intersectPlane(lookPlane,lookPoint);
      const danceInput=document.querySelector('[data-animation="dance"]').checked;danceBlend=THREE.MathUtils.damp(danceBlend,danceInput?1:0,5,dt);
      const danceBeat=time*3.2,danceStep=time*6.4;
      bodyPivot.position.y=params.bodyPosY+Math.abs(Math.sin(danceBeat))*.035*danceBlend;
      bodyPivot.rotation.set(params.bodyRotX,params.bodyRotY,params.bodyRotZ+Math.sin(danceBeat)*.15*danceBlend);
      bodyPivot.scale.set(1+Math.sin(danceBeat*2)*.025*danceBlend,1-Math.abs(Math.sin(danceBeat*2))*.035*danceBlend,1+Math.sin(danceBeat*2)*.025*danceBlend);
      headGroup.position.set(params.headPosX+Math.sin(danceBeat)*.025*danceBlend,params.headPosY,params.headPosZ);
      headGroup.rotation.set(params.headRotX+Math.sin(danceStep)*.08*danceBlend,params.headRotY,params.headRotZ+Math.sin(danceBeat+.5)*.2*danceBlend);
      wingLPivot.rotation.set(Math.sin(danceStep)*.22*danceBlend,params.wingBaseRotY,params.wingBaseRotZ+Math.abs(Math.sin(danceStep))*.055*danceBlend);
      wingRPivot.rotation.set(-Math.sin(danceStep)*.22*danceBlend,-params.wingBaseRotY,-params.wingBaseRotZ-Math.abs(Math.sin(danceStep))*.055*danceBlend);
      tailPivot.rotation.set(0,params.tailRotY+Math.sin(danceStep)*.28*danceBlend,params.tailRotZ+Math.sin(danceStep+.6)*.1*danceBlend);
      footPivots.forEach(({pivot},i)=>{const phase=danceStep+i*Math.PI;pivot.position.y=.15+Math.max(0,Math.cos(phase))*.035*danceBlend;pivot.rotation.set(0,0,Math.sin(phase)*.32*danceBlend);});
      const gx=THREE.MathUtils.clamp((lookPoint.x-root.position.x)/2.8,-1,1)*(animations.cursorEyes?1:0),gy=THREE.MathUtils.clamp((lookPoint.y-.7)/2,-1,1)*(animations.cursorEyes?1:0);
      const blinkPhase=time%4.1,blink=animations.blink?Math.max(0,1-Math.abs(blinkPhase-.12)/.085,1-Math.abs(blinkPhase-.29)/.075):0;
      eyes.forEach((eye,i)=>{eye.children[1].position.set(params.pupilShiftX+gx*.045, .01+gy*.035,.08);eye.children[0].scale.y=params.eyeHeight*(1-blink*.88);eye.children[1].scale.y=1.2*params.pupilScale*params.pupilScaleY*(1-blink*.88);});
      renderer.render(scene,camera);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
