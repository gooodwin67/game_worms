<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Worms · Hot Seat</title>
    <base href="./">
    <link rel="stylesheet" href="./style.css">
    <!-- В архиве Яндекс Игр SDK доступен по этому адресу. -->
    <script src="/sdk.js"></script>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main id="game-root" class="game-root">
      <canvas id="game-canvas" class="game-canvas" aria-label="Игровая сцена"></canvas>

      <section id="loading-screen" class="overlay overlay--visible" aria-live="polite">
        <div class="panel">
          <h1 data-i18n="loading">Загрузка…</h1>
          <div class="loader" aria-hidden="true"></div>
        </div>
      </section>

      <section id="start-screen" class="overlay" hidden>
        <div class="panel">
          <p class="eyebrow">TACTICAL ARTILLERY · RAPIER 2D</p>
          <h1 data-i18n="title">Новая игра</h1>
          <p data-i18n="subtitle">Чистая основа для следующего проекта.</p>
          <button id="start-button" class="primary-button" type="button" data-i18n="start">Играть</button>
        </div>
      </section>

      <section id="hud" class="hud" hidden>
        <strong data-i18n="game">Игра</strong>
        <span><span data-i18n="score">Счёт</span>: <b id="score">0</b></span>
        <button id="reward-button" type="button" data-i18n="reward">Награда за рекламу</button>
        <button id="fullscreen-ad-button" type="button" data-i18n="ad">Полноэкранная реклама</button>
      </section>

      <div class="global-controls">
        <button id="sound-button" type="button" aria-label="Sound">🔊</button>
        <button id="language-button" type="button" aria-label="Language">RU</button>
      </div>
    </main>
  </body>
</html>
